services:
  - type: web
    name: chronicle-global-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm --workspace=server run build
    startCommand: npm --workspace=server run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        value: https://chronicle-global.vercel.app
      - key: CACHE_TTL
        value: 300
      - key: USE_MOCK_NEWS
        value: false
    disk:
      name: chronicle-news-cache
      mountPath: /opt/render/project/src/server/data
      sizeGB: 1
